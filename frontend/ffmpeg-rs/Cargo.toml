[package]
name = "ffmpeg-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ffmpeg-rs"
path = "src/main.rs"

[lib]
name = "ffmpeg_rs"
path = "src/lib.rs"

[dependencies]
ffmpeg-next = "8.0.0"
hound = "3.5.1"
parking_lot = "0.12.5"
simplelog = "0.12.2"
spin_sleep = "1.3.3"
sysinfo = "0.36.1"
wasapi = "0.19.0"
windows-capture = "=2.0.0-alpha.7"
# windows-capture = { path = "../windows-capture" }

[dependencies.windows]
version = "0.62.2"
features = [
    "Storage",
    "Storage_Streams",
    "std",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",

    "Wdk_System_Threading",
    "Win32_Security",
    "Win32_System_Kernel",
]

[profile.release]
opt-level = 3
